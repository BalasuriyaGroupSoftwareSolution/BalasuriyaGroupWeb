<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B2A55"/>
      <stop offset="100%" stop-color="#12386F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyBlue)"/>

  <!-- blueprint grid -->
  <g stroke="#3E6BA8" stroke-width="1" opacity="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/><line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/><line x1="100" y1="0" x2="100" y2="500"/><line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/><line x1="250" y1="0" x2="250" y2="500"/><line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/><line x1="400" y1="0" x2="400" y2="500"/><line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/><line x1="550" y1="0" x2="550" y2="500"/><line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="650" y1="0" x2="650" y2="500"/><line x1="700" y1="0" x2="700" y2="500"/><line x1="750" y1="0" x2="750" y2="500"/>
  </g>

  <!-- planned warehouse outline (dashed, not yet built) -->
  <g fill="none" stroke="#DCE6EF" stroke-width="3" stroke-dasharray="10 8">
    <rect x="150" y="220" width="380" height="180"/>
    <polygon points="150,220 340,160 530,220"/>
    <rect x="560" y="270" width="110" height="130"/>
    <polygon points="560,270 615,235 670,270"/>
  </g>

  <!-- planned roller doors + windows (dashed) -->
  <g fill="none" stroke="#F5A623" stroke-width="2.5" stroke-dasharray="6 6">
    <rect x="190" y="300" width="70" height="100"/>
    <rect x="280" y="300" width="70" height="100"/>
    <rect x="370" y="300" width="70" height="100"/>
    <rect x="590" y="320" width="50" height="60"/>
  </g>

  <!-- planned truck + measurement callouts -->
  <g stroke="#8FB3DC" stroke-width="2" fill="none" stroke-dasharray="4 5">
    <rect x="120" y="370" width="80" height="35"/>
    <rect x="90" y="355" width="35" height="50"/>
    <circle cx="115" cy="405" r="8"/>
    <circle cx="180" cy="405" r="8"/>
  </g>

  <!-- dimension markers -->
  <g stroke="#F5A623" stroke-width="1.5">
    <line x1="150" y1="430" x2="530" y2="430"/>
    <line x1="150" y1="424" x2="150" y2="436"/>
    <line x1="530" y1="424" x2="530" y2="436"/>
  </g>
  <text x="300" y="450" fill="#DCE6EF" font-family="monospace" font-size="16" text-anchor="middle">PLANNED — 40m FRONTAGE</text>

  <text x="400" y="60" fill="#8FB3DC" font-family="monospace" font-size="14" text-anchor="middle" letter-spacing="4">SITE PLAN — PHASE 1</text>
</svg>
