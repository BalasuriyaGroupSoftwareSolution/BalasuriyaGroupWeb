<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyRen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E9CBA3"/>
      <stop offset="100%" stop-color="#F7E8D4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyRen)"/>
  <circle cx="120" cy="90" r="44" fill="#F5A623" opacity="0.7"/>

  <!-- ground -->
  <rect x="0" y="430" width="800" height="70" fill="#D8C3A5"/>
  <rect x="0" y="430" width="800" height="6" fill="#B79E7C"/>

  <!-- heritage building facade -->
  <rect x="160" y="180" width="480" height="250" fill="#EADFC8"/>
  <polygon points="160,180 400,110 640,180" fill="#8C4A3B"/>
  <rect x="160" y="178" width="480" height="10" fill="#6E3A2E"/>

  <!-- columns -->
  <g fill="#F3ECDD">
    <rect x="185" y="230" width="22" height="200"/>
    <rect x="290" y="230" width="22" height="200"/>
    <rect x="488" y="230" width="22" height="200"/>
    <rect x="593" y="230" width="22" height="200"/>
  </g>

  <!-- arched windows -->
  <g fill="#3A5A8C">
    <path d="M230 260 q20 -34 40 0 v70 h-40 z"/>
    <path d="M335 260 q20 -34 40 0 v70 h-40 z"/>
    <path d="M425 260 q20 -34 40 0 v70 h-40 z"/>
    <path d="M530 260 q20 -34 40 0 v70 h-40 z"/>
  </g>

  <!-- door -->
  <path d="M375 430 v-90 q25 -40 50 0 v90 z" fill="#6E3A2E"/>

  <!-- scaffolding over right half, indicating active renovation -->
  <g stroke="#94A3B8" stroke-width="4" fill="none">
    <rect x="460" y="150" width="190" height="290"/>
    <line x1="460" y1="195" x2="650" y2="195"/>
    <line x1="460" y1="240" x2="650" y2="240"/>
    <line x1="460" y1="285" x2="650" y2="285"/>
    <line x1="460" y1="330" x2="650" y2="330"/>
    <line x1="460" y1="375" x2="650" y2="375"/>
    <line x1="505" y1="150" x2="505" y2="440"/>
    <line x1="550" y1="150" x2="550" y2="440"/>
    <line x1="595" y1="150" x2="595" y2="440"/>
    <line x1="460" y1="150" x2="505" y2="195"/>
    <line x1="550" y1="150" x2="595" y2="195"/>
    <line x1="460" y1="240" x2="505" y2="285"/>
    <line x1="550" y1="240" x2="595" y2="285"/>
    <line x1="460" y1="330" x2="505" y2="375"/>
    <line x1="550" y1="330" x2="595" y2="375"/>
  </g>
  <g fill="#F5A623">
    <rect x="465" y="188" width="34" height="8"/>
    <rect x="560" y="278" width="34" height="8"/>
  </g>

  <!-- foreground trees -->
  <g>
    <rect x="90" y="380" width="8" height="50" fill="#6E3A2E"/>
    <circle cx="94" cy="365" r="26" fill="#5C7A4E"/>
    <rect x="700" y="385" width="8" height="45" fill="#6E3A2E"/>
    <circle cx="704" cy="372" r="24" fill="#5C7A4E"/>
  </g>
</svg>
