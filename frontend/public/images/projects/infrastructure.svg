<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="skyInf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1E3F"/>
      <stop offset="55%" stop-color="#7A5A8C"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#skyInf)"/>
  <circle cx="400" cy="300" r="70" fill="#FFD98A" opacity="0.55"/>

  <!-- hills -->
  <path d="M0 300 Q160 250 320 290 T640 270 T800 300 V500 H0 Z" fill="#1E3A6E" opacity="0.75"/>
  <path d="M0 340 Q200 300 400 330 T800 320 V500 H0 Z" fill="#0B1E3F"/>

  <!-- bridge piers -->
  <rect x="150" y="330" width="22" height="90" fill="#3A5A8C"/>
  <rect x="330" y="310" width="22" height="110" fill="#3A5A8C"/>
  <rect x="520" y="315" width="22" height="105" fill="#3A5A8C"/>
  <path d="M140 335 Q245 275 350 315" fill="none" stroke="#4A6FA5" stroke-width="10"/>
  <path d="M330 315 Q430 265 530 320" fill="none" stroke="#4A6FA5" stroke-width="10"/>

  <!-- highway with perspective -->
  <polygon points="260,500 540,500 470,360 330,360" fill="#2B2F3A"/>
  <polygon points="330,360 470,360 460,340 340,340" fill="#20232B"/>
  <!-- lane markings -->
  <g fill="#F5A623">
    <polygon points="392,500 408,500 402,430 398,430"/>
    <polygon points="396,410 404,410 401,385 399,385"/>
    <polygon points="399,372 403,372 401.5,360 400.5,360"/>
  </g>

  <!-- roadside lamp posts -->
  <g stroke="#DCE6EF" stroke-width="3">
    <line x1="255" y1="500" x2="270" y2="380"/>
    <line x1="545" y1="500" x2="530" y2="380"/>
  </g>
  <circle cx="270" cy="378" r="6" fill="#F5A623"/>
  <circle cx="530" cy="378" r="6" fill="#F5A623"/>

  <!-- crane silhouette -->
  <g opacity="0.9">
    <rect x="620" y="150" width="5" height="180" fill="#0B1E3F"/>
    <rect x="590" y="150" width="130" height="5" fill="#0B1E3F"/>
    <line x1="700" y1="155" x2="700" y2="200" stroke="#0B1E3F" stroke-width="3"/>
  </g>
</svg>
