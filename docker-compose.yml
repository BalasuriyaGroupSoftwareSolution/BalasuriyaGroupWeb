# Local development database only. Run: docker compose up -d
# Then set DATABASE_URL and DATABASE_URL_UNPOOLED in .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: balasuriya_group
    ports:
      - "5432:5432"
    volumes:
      - bg_postgres_data:/var/lib/postgresql/data

volumes:
  bg_postgres_data:
